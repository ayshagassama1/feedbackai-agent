server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html (pas de router aujourd'hui,
    # mais évite une 404 nginx si ça change plus tard).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html référence le bundle JS/CSS par son nom hashé (change à chaque build) : sans
    # revalidation forcée, un navigateur peut le garder en cache et continuer à charger un
    # ancien bundle indéfiniment après un redéploiement — mesuré le 2026-08-31, un lien de
    # ticket obsolète ne se corrigeait qu'après un hard refresh. Les fichiers hashés eux-mêmes
    # (sous /assets/, nom différent à chaque contenu différent) peuvent être mis en cache sans
    # risque, aussi longtemps que possible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
