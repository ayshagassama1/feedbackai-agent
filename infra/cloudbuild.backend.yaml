steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/feedback-agent:$BUILD_ID
      - ./agent

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/feedback-agent:$BUILD_ID

  # GOOGLE_GENAI_USE_VERTEXAI/GOOGLE_CLOUD_PROJECT/GOOGLE_CLOUD_LOCATION (fixes, pas des
  # substitutions) : bascule tous les appels Gemini sur Vertex AI (facturé sur les crédits GCP)
  # plutôt que l'API Gemini directe (palier gratuit plafonné dur à 20 requêtes/jour, mesuré le
  # 2026-08-30 en plein tournage). gemini-3.5-flash n'est disponible que sur la location
  # "global" pour ce projet (404 mesuré sur us-central1) — ne pas changer sans retester.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - feedback-agent
      - --image=gcr.io/$PROJECT_ID/feedback-agent:$BUILD_ID
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,MONGODB_DB=feedbackai,GEMMA_LOCATION=${_GEMMA_LOCATION},GEMMA_ENDPOINT_ID=${_GEMMA_ENDPOINT_ID},FRONTEND_ORIGINS=${_FRONTEND_ORIGIN},PUBSUB_PUSH_SERVICE_ACCOUNT=${_PUBSUB_PUSH_SERVICE_ACCOUNT},RUN_CYCLE_AUDIENCE=${_RUN_CYCLE_AUDIENCE},GOOGLE_GENAI_USE_VERTEXAI=True,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,MONGODB_URI=mongodb-uri:latest,GITHUB_TOKEN=github-token:latest,GITHUB_REPO_MAP=github-repo-map:latest,RUN_CYCLE_SECRET=run-cycle-secret:latest

images:
  - gcr.io/$PROJECT_ID/feedback-agent:$BUILD_ID

substitutions:
  # GEMMA_ENDPOINT_ID vide par défaut -> fallback Gemini automatique tant que Gemma
  # n'est pas déployé. La mettre à jour ensuite avec :
  #   gcloud run services update feedback-agent --region=us-central1 \
  #     --update-env-vars=GEMMA_ENDPOINT_ID=<id>
  _GEMMA_LOCATION: "us-central1"
  _GEMMA_ENDPOINT_ID: ""
  # À écraser au submit avec l'URL réelle du frontend déployé, ex. :
  #   --substitutions=_FRONTEND_ORIGIN=https://feedback-agent-frontend-xxxx.run.app
  _FRONTEND_ORIGIN: "http://localhost:5173"
  # Auth OIDC de la subscription push Pub/Sub (étape 3.2, README section "Scheduled trigger").
  # Vides par défaut -> _verify_pubsub_oidc() rejette systématiquement (401), le cycle autonome
  # planifié ne fonctionne plus tant qu'ils ne sont pas explicitement passés au submit. Mesuré
  # le 2026-08-28 : --set-env-vars remplace tout l'environnement à chaque redéploiement, donc un
  # réglage fait une seule fois via `gcloud run services update` était silencieusement effacé à
  # chaque redéploiement suivant du backend, cassant la vraie boucle Pub/Sub sans que les tests
  # au secret partagé (RUN_CYCLE_SECRET) ne le révèlent.
  _PUBSUB_PUSH_SERVICE_ACCOUNT: ""
  _RUN_CYCLE_AUDIENCE: ""
