steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/feedback-agent:$COMMIT_SHA
      - ./agent

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/feedback-agent:$COMMIT_SHA

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - feedback-agent
      - --image=gcr.io/$PROJECT_ID/feedback-agent:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID
      - --memory=1Gi
      - --cpu=1

images:
  - gcr.io/$PROJECT_ID/feedback-agent:$COMMIT_SHA
